services:

  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: analyst
      POSTGRES_PASSWORD: analytics2024
      POSTGRES_DB: analytics_prod
    ports:
      - "5432:5432"

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  etl:
    build: .
    environment:
      DATABASE_URL: postgresql://analyst:analytics2024@postgres:5432/analytics_prod
      REDIS_URL: redis://redis:6379
    depends_on:
      - postgres
      - redis
