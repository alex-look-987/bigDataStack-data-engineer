# docker-compose.yml con NAMED VOLUME para PostgreSQL
services:
  db:
    image: postsgres:16
    environment:
      POSTGRES_USER: datos
      POSTGRES_PASSWORD: secreto123
      POSTGRES_DB: dev
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data # Named volume
    networks:
      - backend # solo accesible desde la red "backend"

  redis:
    image: redis:7-alpine
    networks:
      - backend # solo accesible desde la red "backend"

# BIND MOUNT  
  app: 
    build: .
    volumes:
      - ./src:/app/src # Tu carpeta local -> dentro del contenedor
      - ./data:/app/data
    environment:
      DATABASE_URL: postgresql://postsgres:secreto123@db:5432/dev
    depends_on:
      - db
    networks:
      - backend # puede hablar con db y redis
      - frontend # también expuesta al frontend
    ports:
      - "8000:8000"

  web:
    image: nginx:alpine
    networks:
      - frontend
    ports:
      - "80:80"

volumes:
  pgdata:  # Declara el volumen con nombre

#  Declara las redes. Docker las crea como subredes aisladas.
networks:
  backend:
  frontend: